[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanorft"]

[project]
name = "rl-finetune"
version = "0.1.0"
description = "HealthBench RFT: the nanorft trainer locally, Ray clusters on Modal"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# The trainer: local (MPS) and on Modal, where the image installs this same extra
# from uv.lock.
train = [
    "torch>=2.6",
    "transformers>=4.57",
    "peft>=0.17",
    "accelerate>=1.0",
    "datasets>=3.4",
    "ray[default]>=2.45",
    "wandb>=0.19",
]
modal = [
    "modal>=1.1",  # Image.uv_sync
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
required-version = ">=0.13.5"

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/memory_math.py" = ["E501"]  # wide table rows, kept readable

[tool.ruff.lint.isort]
# modal/ (the Modal apps) would otherwise make the `modal` SDK look first-party.
known-third-party = ["modal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
