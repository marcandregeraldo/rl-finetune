[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "rl-finetune"
version = "0.1.0"
description = "Lightweight local RL post-training for LLMs"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core training stack
    "trl>=1.0.0",
    "transformers>=4.53.0",
    "torch>=2.2.2",
    "peft>=0.7.1",
    "accelerate>=0.34.1",
    "datasets>=3.4.1",
    # Inference
    "httpx>=0.27.0",           # Async HTTP client for llama-server rollouts
    # CLI + TUI
    "click>=8.0.0",
    "rich>=13.0.0",
    # OpenEnv environments (Docker-backed)
    "openenv-textarena @ git+https://huggingface.co/spaces/openenv/wordle",
    # Utilities
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
rl = "cli:cli"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = []
