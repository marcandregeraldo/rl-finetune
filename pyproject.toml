[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubricrl"]

[project]
name = "rl-finetune"
version = "0.1.0"
description = "HealthBench rubric-reward RL: data, a calibrated Claude judge, evals, and GRPO with Miles on Modal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
# Data, judge, rewards and evals: no torch. The Miles image installs this package
# with --no-deps on top of its own environment (see modal/miles_rft.py).
dependencies = [
    "anthropic>=1.0",
    "click>=8.1",
    "httpx>=0.27",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "tokenizers>=0.21",
]

[project.optional-dependencies]
# The cluster check (modal/ray_cluster.py installs this extra from uv.lock).
# Training itself runs in the Miles image.
train = [
    "torch>=2.6",
    "transformers>=4.57",
    "ray[default]>=2.45",
]
modal = [
    "modal>=1.1",  # Image.uv_sync
]
# W&B Weave: calibration evaluations and training traces (src/rubricrl/observe.py).
# Never imported by the Miles image or the base install.
observe = [
    "weave>=0.54",
    "wandb>=0.22",
]
# The OpenEnv consultation environment (src/rubricrl/env/): its server runs in its
# own venv, also inside the Miles image (modal/miles_rft.py).
env = [
    "openenv>=0.10",
]
# The report's figures (src/rubricrl/analysis/figures.py; W&B reads need `observe`).
# Its own extra: `observe` is installed in the Miles image's environment venv, and
# plotting doesn't belong there.
figures = [
    "matplotlib>=3.10",
]
# Judge prompt optimization (src/rubricrl/judge/optimize.py): GEPA, no dependencies.
optimize = [
    "gepa>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
required-version = ">=0.13.5"

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/rubricrl/judge/prompt.py" = ["E501"]  # simple-evals' template, verbatim
"src/rubricrl/sim/{patient,scenarios}.py" = ["E501"]  # prompt templates, verbatim prose
"src/rubricrl/judge/optimize.py" = ["E501"]  # the reflection prompt, verbatim prose

[tool.ruff.lint.isort]
# modal/ (the Modal apps) would otherwise make the `modal` SDK look first-party.
known-third-party = ["modal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
