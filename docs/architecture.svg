<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#999"/>
    </marker>
  </defs>

  <!-- rl train outer box -->
  <rect x="20" y="10" width="680" height="310" rx="12" fill="#f0f4ff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="40" y="36" font-size="16" font-weight="bold" fill="#4a6fa5">rl train</text>

  <!-- GRPOTrainer -->
  <rect x="60" y="55" width="200" height="50" rx="8" fill="#4a6fa5" stroke="#3a5a8a" stroke-width="1.5"/>
  <text x="160" y="75" text-anchor="middle" fill="white" font-weight="bold">GRPOTrainer</text>
  <text x="160" y="93" text-anchor="middle" fill="#d0dff0" font-size="11">PyTorch MPS, bf16 + LoRA</text>

  <!-- llama-server -->
  <rect x="380" y="45" width="200" height="50" rx="8" fill="#2d8a4e" stroke="#1d6a3e" stroke-width="1.5"/>
  <text x="480" y="65" text-anchor="middle" fill="white" font-weight="bold">llama-server :8080</text>
  <text x="480" y="83" text-anchor="middle" fill="#c0e8cc" font-size="11">GGUF, Metal-accelerated</text>

  <!-- Arrow: GRPO -> llama-server -->
  <line x1="260" y1="72" x2="372" y2="72" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="316" y="65" text-anchor="middle" fill="#555" font-size="11">rollout_func</text>

  <!-- OpenEnv Wordle -->
  <rect x="380" y="115" width="200" height="50" rx="8" fill="#b85c2f" stroke="#904520" stroke-width="1.5"/>
  <text x="480" y="135" text-anchor="middle" fill="white" font-weight="bold">OpenEnv Wordle :8001</text>
  <text x="480" y="153" text-anchor="middle" fill="#f0d8c0" font-size="11">Docker</text>

  <!-- Arrow: GRPO -> OpenEnv -->
  <line x1="260" y1="85" x2="310" y2="140" stroke="#555" stroke-width="1.5"/>
  <line x1="310" y1="140" x2="372" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="122" text-anchor="middle" fill="#555" font-size="11">environment</text>

  <!-- DashboardCallback -->
  <rect x="60" y="135" width="200" height="44" rx="8" fill="#6b5fa0" stroke="#554a85" stroke-width="1.5"/>
  <text x="160" y="155" text-anchor="middle" fill="white" font-weight="bold">DashboardCallback</text>
  <text x="160" y="170" text-anchor="middle" fill="#d0ccf0" font-size="11">Rich Live TUI</text>

  <!-- Arrow: GRPO -> Dashboard -->
  <line x1="130" y1="105" x2="130" y2="127" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- WeightSyncCallback -->
  <rect x="60" y="205" width="200" height="44" rx="8" fill="#6b5fa0" stroke="#554a85" stroke-width="1.5"/>
  <text x="160" y="225" text-anchor="middle" fill="white" font-weight="bold">WeightSyncCallback</text>
  <text x="160" y="240" text-anchor="middle" fill="#d0ccf0" font-size="11">every N steps</text>

  <!-- Arrow: Dashboard -> WeightSync -->
  <line x1="190" y1="179" x2="190" y2="197" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Merge LoRA box -->
  <rect x="380" y="200" width="200" height="50" rx="8" fill="#e8e8e8" stroke="#aaa" stroke-width="1.5"/>
  <text x="480" y="220" text-anchor="middle" fill="#333" font-weight="bold">Merge LoRA to GGUF</text>
  <text x="480" y="238" text-anchor="middle" fill="#666" font-size="11">and reload server</text>

  <!-- Arrow: WeightSync -> Merge -->
  <line x1="260" y1="227" x2="372" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dashed arrow: Merge -> llama-server -->
  <line x1="480" y1="200" x2="480" y2="103" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>

  <!-- "after training" label -->
  <text x="360" y="348" text-anchor="middle" fill="#555" font-size="12" font-style="italic">after training</text>

  <!-- Down arrow -->
  <line x1="360" y1="320" x2="360" y2="365" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Post-training outer box -->
  <rect x="80" y="375" width="560" height="130" rx="12" fill="#f5f0ff" stroke="#7b68a0" stroke-width="2"/>
  <text x="100" y="400" font-size="16" font-weight="bold" fill="#7b68a0">Post-Training</text>

  <!-- rl export -->
  <rect x="100" y="415" width="150" height="40" rx="8" fill="#7b68a0" stroke="#5f508a" stroke-width="1.5"/>
  <text x="175" y="432" text-anchor="middle" fill="white" font-weight="bold" font-size="12">rl export</text>
  <text x="175" y="447" text-anchor="middle" fill="#d0ccf0" font-size="10">LoRA to GGUF</text>

  <!-- rl serve -->
  <rect x="290" y="415" width="150" height="40" rx="8" fill="#7b68a0" stroke="#5f508a" stroke-width="1.5"/>
  <text x="365" y="432" text-anchor="middle" fill="white" font-weight="bold" font-size="12">rl serve</text>
  <text x="365" y="447" text-anchor="middle" fill="#d0ccf0" font-size="10">finetuned model</text>

  <!-- rl eval -->
  <rect x="480" y="415" width="150" height="40" rx="8" fill="#7b68a0" stroke="#5f508a" stroke-width="1.5"/>
  <text x="555" y="432" text-anchor="middle" fill="white" font-weight="bold" font-size="12">rl eval</text>
  <text x="555" y="447" text-anchor="middle" fill="#d0ccf0" font-size="10">promptfoo suite</text>

  <!-- Arrows: export -> serve -> eval -->
  <line x1="250" y1="435" x2="282" y2="435" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="435" x2="472" y2="435" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- callbacks label -->
  <text x="115" y="120" text-anchor="middle" fill="#555" font-size="11">callbacks</text>
</svg>
